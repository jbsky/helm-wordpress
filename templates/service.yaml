apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "wordpress.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fpm-metric
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  # === Prometheus annotations ===
  annotations:
    prometheus.io/scrape: 'true'
spec:
  type: NodePort
  selector:
    {{- include "wordpress.selectorLabels" . | nindent 4 }}
  ports:
    - port:  {{ .Values.phpfpmexporter.containerPort }}
      nodePort: {{ .Values.phpfpmexporter.nodePort }}
      name: fpm-metric
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-metric
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  # === Prometheus annotations ===
  annotations:
    prometheus.io/scrape: 'true'
spec:
  type: NodePort
  selector:
    {{- include "wordpress.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.nginxexporter.containerPort }}
      nodePort: {{ .Values.nginxexporter.nodePort }}
      name: nginx-metric
